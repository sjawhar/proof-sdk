<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>@sjawhar/proof-editor browser smoke test</title>
  <link rel="stylesheet" href="../src/lib.css">
  <style>
    #smoke-layout { display: flex; gap: 16px; font-family: sans-serif; }
    .pane { flex: 1; border: 1px solid #ccc; }
    .pane h2 { font-size: 13px; padding: 6px 10px; margin: 0; background: #eee; }
    #editor-a, #editor-b { min-height: 400px; }
    #status { position: fixed; bottom: 0; left: 0; right: 0; background: #111; color: #0f0; font-family: monospace; font-size: 11px; padding: 6px; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
  </style>
</head>
<body>
  <div id="smoke-layout">
    <div class="pane">
      <h2>Editor A (docA)</h2>
      <div id="editor-a"></div>
    </div>
    <div class="pane">
      <h2>Editor B (docB)</h2>
      <div id="editor-b"></div>
      <div id="editor-c"></div>
    </div>
  </div>
  <div id="status">booting…</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
