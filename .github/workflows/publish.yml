name: Publish @sjawhar/proof-editor

# Publishes the library entry (src/lib.ts + src/lib-headless.ts), not the
# proof-sdk app. Triggered by pushing a `v*` tag (e.g. `v0.1.0`) whose version
# matches package.json.
#
# Authentication is npm trusted publishing (OIDC): the @sjawhar/proof-editor
# package on npmjs.com lists this repository and this workflow file as a
# trusted publisher, so `npm publish` exchanges the job's GitHub OIDC token
# for a short-lived npm credential. No NPM_TOKEN secret exists or is needed;
# `id-token: write` is what grants the exchange. npm requires npm >= 11.5 for
# OIDC, which ships with Node 24.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require npm with OIDC trusted publishing
        run: |
          npm --version
          node -e 'const [m, n] = process.versions.npm.split(".").map(Number); if (m < 11 || (m === 11 && n < 5)) { console.error("npm >= 11.5 required for OIDC publishing"); process.exit(1) }'

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # package-lock.json is gitignored in this repo (see .gitignore: "keep
      # package.json"), so there is no lockfile to `npm ci` against.
      - name: Install dependencies
        run: npm install

      - name: Build library
        run: npm run build:lib

      # The library's own README.lib.md, not the app's README.md, is what
      # should render on npmjs.com. This overwrites README.md only in this
      # ephemeral CI checkout, right before packing — it is never committed.
      - name: Use library README for the published package
        run: cp README.lib.md README.md

      - name: Publish
        run: npm publish --provenance --access public
